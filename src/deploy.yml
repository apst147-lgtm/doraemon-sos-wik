name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # กำหนดให้ Workflow ทำงานเมื่อมีการ Push ไปที่ branch 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest # ใช้ระบบปฏิบัติการ Ubuntu เวอร์ชันล่าสุดสำหรับรัน Job

    steps:
    - name: Checkout repository # ขั้นตอนที่ 1: ดึงโค้ดจาก Repository
      uses: actions/checkout@v4

    - name: Set up Node.js # ขั้นตอนที่ 2: ตั้งค่าสภาพแวดล้อม Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # กำหนดเวอร์ชัน Node.js ที่ใช้ (แนะนำให้ใช้เวอร์ชัน LTS ล่าสุด)

    - name: Install dependencies # ขั้นตอนที่ 3: ติดตั้ง Dependencies ของโปรเจกต์
      run: npm install

    - name: Build project # ขั้นตอนที่ 4: Build โปรเจกต์ (จะสร้างโฟลเดอร์ 'dist')
      run: npm run build

    - name: Deploy to GitHub Pages # ขั้นตอนที่ 5: Deploy ไฟล์ที่ Build แล้วขึ้น GitHub Pages
      uses: peaceiris/actions-gh-pages@v3 # ใช้ Action ยอดนิยมสำหรับ Deploy ขึ้น GitHub Pages
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }} # ใช้ GitHub Token ที่มีมาให้โดยอัตโนมัติสำหรับการยืนยันตัวตน
        publish_dir: ./dist # กำหนดโฟลเดอร์ที่ต้องการ Publish (Vite จะ Build ไปที่ 'dist' โดย Default)
        # publish_branch: gh-pages # โดยปกติจะ Deploy ไปที่ branch 'gh-pages' (เป็น Default ของ Action นี้)
        # cname: your-custom-domain.com # หากคุณมี Custom Domain ให้ uncomment บรรทัดนี้และใส่ชื่อโดเมนของคุณ